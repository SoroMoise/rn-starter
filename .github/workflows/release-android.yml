name: Release Android

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space on the runner
        run: |
          echo "::group::Disk before cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/share/miniconda \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/PyPy \
            || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "::group::Disk after cleanup"
          df -h /
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Compute next version
        id: version
        run: bash .github/scripts/compute-android-version.sh

      # The PR title becomes the Play release name, which is what labels the build in
      # the Play Console history long after the review is over. Play rejects names
      # past 50 characters, so it is truncated and the cut is marked.
      - name: Compute release name
        id: release_name
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          title="$(printf '%s' "${PR_TITLE:-}" | tr -d '\r\n' | sed 's/  */ /g; s/^ //; s/ $//')"
          if [ -n "$title" ]; then
            name="$NEW_VERSION - $title"
          else
            name="$NEW_VERSION"
          fi
          if [ "${#name}" -gt 50 ]; then
            name="${name:0:47}..."
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Release name: $name"

      - name: Apply version to app.config.js
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/const version = '[0-9]\+\.[0-9]\+\.[0-9]\+'/const version = '$NEW_VERSION'/" apps/mobile/app.config.js
          echo "Releasing $NEW_VERSION (versionCode ${{ steps.version.outputs.version_code }}, bump ${{ steps.version.outputs.bump }})"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Ensure required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Play package name
        id: package
        working-directory: apps/mobile
        run: |
          pkg="$(node -e "const c=require('./app.config.js').default();process.stdout.write(c.expo.android.package)")"
          if [ -z "$pkg" ]; then
            echo "error: could not read expo.android.package from apps/mobile/app.config.js" >&2
            exit 1
          fi
          echo "name=$pkg" >> "$GITHUB_OUTPUT"
          echo "Publishing as $pkg"

      # The template ships Google's sample AdMob app id because the SDK crashes at launch
      # without one. A release carrying it pairs the app's own units with Google's test app,
      # and nothing on the device would say so; the release refuses it here. A release
      # whose units are all still pending is legitimate (an app can launch ad-free) but
      # requests no ad at all, so it is flagged rather than refused.
      - name: Check the AdMob configuration
        working-directory: apps/mobile
        run: |
          app_id="$(node -e "const c=require('./app.config.js').default();const p=c.expo.plugins.find((e)=>Array.isArray(e)&&e[0]==='react-native-google-mobile-ads');process.stdout.write(p?String(p[1].androidAppId??''):'')")"
          case "$app_id" in
            ca-app-pub-3940256099942544~*)
              echo "::error::apps/mobile/app.config.js still carries Google's sample AdMob app id ($app_id). Put the app's own in the react-native-google-mobile-ads plugin block before releasing."
              exit 1
              ;;
          esac
          if [ -n "$app_id" ] && ! grep -Eq "android: 'ca-app-pub-[0-9]{16}/[0-9]{10}'" constants/admob.ts; then
            echo "::warning::Every Android unit in apps/mobile/constants/admob.ts is still UNIT_PENDING: this release requests no ad."
          fi

      # The legal links are constants, and the template's point at a placeholder site. Play requires
      # a privacy policy that opens, the paywall links it beside every buy button, and a build
      # already installed keeps its links whatever a later release fixes.
      - name: Refuse the template's legal links
        working-directory: apps/mobile
        run: |
          if grep -Eq "yourapp\.example\.com|support@example\.com" constants/legal.ts; then
            echo "::error::apps/mobile/constants/legal.ts still points at the template's placeholder site or support address. Set the app's own site and support address there before releasing."
            exit 1
          fi

      - name: Write mobile .env from secret
        working-directory: apps/mobile
        env:
          MOBILE_DOTENV: ${{ secrets.MOBILE_DOTENV }}
        run: printf '%s' "$MOBILE_DOTENV" > .env

      - name: Refuse development overrides
        working-directory: apps/mobile
        run: node scripts/check-release-env.js

      - name: Restore google-services.json from secret
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "error: GOOGLE_SERVICES_JSON secret is empty; the Firebase plugins need it at prebuild time" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Prebuild native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install

      # Redundant with app.config.js on a healthy prebuild, and deliberately kept:
      # a versionCode that silently failed to reach build.gradle is only discovered
      # by the Play Console, an hour later, as a rejected upload.
      - name: Apply version to build.gradle
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          sed -i "s/versionName \"[0-9.]\+\"/versionName \"$NEW_VERSION\"/" apps/mobile/android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" apps/mobile/android/app/build.gradle

      - name: Restore release keystore and signing config
        working-directory: apps/mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Checked the same way GOOGLE_SERVICES_JSON is: an empty or truncated secret
          # otherwise produces a 0-byte keystore, and the run dies much later in
          # :app:signReleaseBundle on an error that names the keystore, not the secret.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "error: ANDROID_KEYSTORE_BASE64 secret is empty; the release cannot be signed" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          if [ ! -s release.keystore ]; then
            echo "error: ANDROID_KEYSTORE_BASE64 did not decode to a keystore; check the base64 encoding" >&2
            exit 1
          fi
          {
            echo "STORE_FILE=release.keystore"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > keystore.properties

      - name: Generate the open-source licences list
        working-directory: apps/mobile
        run: node ../../scripts/generate-licences.mjs --android

      - name: Build release bundle (AAB)
        working-directory: apps/mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Report disk usage
        if: always()
        run: |
          df -h /
          du -sh ~/.gradle apps/mobile/android/app/build node_modules 2>/dev/null || true

      - name: Publish to Play Store (internal track)
        id: publish_attempt_1
        continue-on-error: true
        uses: ./.github/actions/publish-play
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: ${{ steps.package.outputs.name }}
          release-name: ${{ steps.release_name.outputs.name }}

      - name: Wait before retrying Play Store publish
        if: steps.publish_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Publish to Play Store (internal track, retry 1)
        id: publish_attempt_2
        if: steps.publish_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/publish-play
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: ${{ steps.package.outputs.name }}
          release-name: ${{ steps.release_name.outputs.name }}

      - name: Wait before retrying Play Store publish again
        if: steps.publish_attempt_2.outcome == 'failure'
        run: sleep 90

      - name: Publish to Play Store (internal track, retry 2)
        id: publish_attempt_3
        if: steps.publish_attempt_2.outcome == 'failure'
        uses: ./.github/actions/publish-play
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: ${{ steps.package.outputs.name }}
          release-name: ${{ steps.release_name.outputs.name }}

      # A publish that failed every attempt has two very different causes, and the
      # run's last error names the wrong one. If Google committed the edit and only
      # lost the response, the retries re-upload the same versionCode and die on
      # `apkUpgradeVersionConflict`, so the annotation reads "version code already
      # used" while the real fault was attempt 1's outage, demoted to a warning by
      # continue-on-error. The release is then live on internal with `main` never
      # bumped, and every later run recomputes the same version into the same wall.
      # The guard reads attempt 1 rather than `failure()` alone so a build that died
      # earlier (leaving attempt 1 `skipped`) never draws this diagnosis.
      - name: Diagnose a publish that failed every attempt
        if: failure() && steps.publish_attempt_1.outcome == 'failure'
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          echo "::warning::Every publish attempt failed; read the job summary before re-running."
          {
            echo "## Play Store publish failed on all three attempts"
            echo
            echo "Target: **v$NEW_VERSION** (versionCode \`$VERSION_CODE\`), internal track."
            echo
            echo "Read the error on **Publish to Play Store (internal track)**: the first"
            echo "attempt. It is the only one that met the Play Console in its original"
            echo "state; the retries may be reporting a consequence of it."
            echo
            echo "If the last attempt says the version code has already been used, an"
            echo "earlier attempt committed its edit despite reporting failure:"
            echo
            echo "- v$NEW_VERSION is already live on the internal track;"
            echo "- \`main\` was never bumped, so this workflow recomputes v$NEW_VERSION and"
            echo "  hits the same conflict on every re-run."
            echo
            echo "Recover by bumping the version in \`apps/mobile/app.config.js\` and"
            echo "\`.last_release_commit\` by hand to match what the Play Console actually"
            echo "holds. Do not simply re-run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB for manual publishing (publish never landed)
        if: failure() && steps.publish_attempt_3.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: app-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Commit version bump back to main
        if: success()
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout -- apps/mobile/constants/licences.generated.json
          git rev-parse HEAD > .last_release_commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.config.js .last_release_commit
          git commit -m "chore(release): v$NEW_VERSION [skip ci]"
          git push origin HEAD:main \
            || { git fetch origin main && git rebase origin/main && git push origin HEAD:main; }
