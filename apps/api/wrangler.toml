name = "rn-starter-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"
# RevenueCat → Project settings → General. Left empty, or without REVENUECAT_SECRET_API_KEY, the
# entitlement check lets every caller through (src/services/revenueCatService.ts).
REVENUECAT_PROJECT_ID = ""

# The entitlement cache. It has no id on purpose: the first `wrangler deploy` creates the
# namespace, and the deploys after it keep the one the Worker is bound to.
[[kv_namespaces]]
binding = "ENTITLEMENT_CACHE"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[unsafe.bindings]]
name = "API_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
